name: Verify images

on:
  push:
    branches: [develop, main, "feat/**", "codex/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test, typecheck, lint, and build
        run: docker build --target build -t uroute-build:${{ gitea.sha }} .
      - name: Build API image
        run: docker build --target api -t uroute-api:${{ gitea.sha }} .
      - name: Build web image
        run: docker build --target web -t uroute-web:${{ gitea.sha }} .
