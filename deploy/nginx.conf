server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 8m;

    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }

    location = /health {
        proxy_pass http://api:3001/ready;
        proxy_set_header Host $http_host;
    }

    location /_kml_images/ {
        limit_except GET {
            deny all;
        }

        resolver 127.0.0.11 valid=300s ipv6=off;
        set $kml_image_host mymaps.usercontent.google.com;
        rewrite ^/_kml_images/(.*)$ /hostedimage/$1 break;
        proxy_pass https://$kml_image_host;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $kml_image_host;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host $kml_image_host;
        proxy_set_header Connection "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Referer "";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
